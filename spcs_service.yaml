spec:
  containers:
    - name: backend
      image: zneenng-hz50319.registry.snowflakecomputing.com/prod/public/gas_lift_images/gas_lift_backend:latest
      env:
        # --- Basic Snowflake configuration ---
        SNOWFLAKE_WAREHOUSE: COMPUTE_WH         
        SNOWFLAKE_ROLE: ACCOUNTADMIN                   
        
        # --- Base / Dev / Default configuration ---
        SNOWFLAKE_DATABASE: SANDBOX 
        SNOWFLAKE_SCHEMA: GLTB
        
        # --- Production query configuration ---
        PROD_SNOWFLAKE_DATABASE: PROD  
        PROD_SNOWFLAKE_SCHEMA: ANALYTICS_D_PRODUCTION     
        PROD_SNOWFLAKE_ROLE: ACCOUNTADMIN        
        
        # --- Raw data query configuration ---
        RAW_SNOWFLAKE_DATABASE: RAW
        RAW_SNOWFLAKE_SCHEMA: AGG__OPERATIONREFERENCE_V02       
        RAW_SNOWFLAKE_ROLE: ACCOUNTADMIN         
        
  endpoints:
    - name: backend-api
      port: 8000
      public: true
